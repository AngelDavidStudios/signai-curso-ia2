# Ronda 6 de b02, generada por `signai-reconocedor automatico` a partir de r05-dimension-128 (la mejor configuración elegible).
barrido = "b02"
ronda = 6

[base.forma]
capas = 4
dimension = 128
cabezas = 8
intermedia = 128

[base.entrenamiento]
optimizador = "adamw"
tasa = 0.001
programacion = "coseno"
regularizacion = 0.05
dropout = 0.1
recorte_gradiente = 1.0
lote = 32
epocas = 100
suavizado_etiquetas = 0.0

